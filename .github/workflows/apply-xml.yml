name: Apply XML language server (one-off)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/apply_xml.py
      - run: |
          rm tools/apply_xml.py
          git config user.name "asm-bot"
          git config user.email "asm-bot@users.noreply.github.com"
          git add -A
          git commit -m "feat(lsp): XML language server (LemMinX) next to jdt.ls

          The editor keeps one language server per language: Java runs jdt.ls and XML runs
          LemMinX, both started through the terminal service. XML files get error marks,
          completion, definition, info and format; the editor offers to install lemminx when it
          is missing.

          Co-Authored-By: Claude Sonnet 5.5 <noreply@anthropic.com>
          Claude-Session: https://claude.ai/code/session_01F7fjto5o3b3MMLCyXNFeJr"
          git push
