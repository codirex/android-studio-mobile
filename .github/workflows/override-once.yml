name: override-once
on: workflow_dispatch
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply the patch
        run: |
          echo "95e7e3e1cfa24d6c5cb36d4ef11da718a40673b53a0e0db617a4fb320e09485a  tools/override.patch" | sha256sum -c -
          git apply --unidiff-zero tools/override.patch
          rm tools/override.patch
      - name: Commit
        run: |
          git config user.name asm-bot
          git config user.email asm-bot@users.noreply.github.com
          git add -A
          git commit -m "feat(editor): override and import completions from the language server" -m "Snippets are read, additional edits (imports) are applied, the caret goes to the first tab stop." -m "Co-Authored-By: Claude Sonnet 5.5 <noreply@anthropic.com>" -m "Claude-Session: https://claude.ai/code/session_01F7fjto5o3b3MMLCyXNFeJr"
          git push
