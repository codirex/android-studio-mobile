name: Apply selection menu (one-off)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/apply_selection.py
      - run: |
          rm tools/apply_selection.py tools/selection_methods.txt
          git config user.name "asm-bot"
          git config user.email "asm-bot@users.noreply.github.com"
          git add -A
          git commit -m "feat(editor): Definition, Info and Format move into the text selection menu

          A long press that selects text now opens one menu: Cut, Copy, Paste, Select all and,
          when the language server of the file is ready, Definition, Info and Format. The fixed
          row of buttons above the editor is gone.

          Co-Authored-By: Claude Sonnet 5.5 <noreply@anthropic.com>
          Claude-Session: https://claude.ai/code/session_01F7fjto5o3b3MMLCyXNFeJr"
          git push
