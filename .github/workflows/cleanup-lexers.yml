name: Cleanup lexers (one-off)

# Removes the hand written lexers that ADR-0026 replaces with TextMate. Delete this file afterwards.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r --ignore-unmatch \
            domain/editor/src/main/java/org/codirex/asm/domain/editor/highlight \
            domain/editor/src/test/java/org/codirex/asm/domain/editor/highlight \
            feature/editor/src/main/java/org/codirex/asm/feature/editor/LexerAnalyzeManager.java \
            feature/editor/src/main/java/org/codirex/asm/feature/editor/LexerLanguage.java
          git commit -m "refactor(editor): remove the hand written lexers (ADR-0026)" || echo "Nothing to remove"
          git push
