name: Apply dock (one-off)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/apply_dock.py
      - run: |
          rm tools/apply_dock.py
          git config user.name "asm-bot"
          git config user.email "asm-bot@users.noreply.github.com"
          git add -A
          git commit -m "feat(app): bottom dock with Files, Build and Terminal

          The project screen gets the dock of the design under the editor. It hides while the
          keyboard is open. Search and Problems join it when those features exist.

          Co-Authored-By: Claude Sonnet 5.5 <noreply@anthropic.com>
          Claude-Session: https://claude.ai/code/session_01F7fjto5o3b3MMLCyXNFeJr"
          git push
