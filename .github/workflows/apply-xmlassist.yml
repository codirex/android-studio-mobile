name: Apply Android XML completion (one-off)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/apply_xmlassist.py
      - run: |
          rm tools/apply_xmlassist.py
          git config user.name "asm-bot"
          git config user.email "asm-bot@users.noreply.github.com"
          git add -A
          git commit -m "feat(editor): Android attribute completion wired into the editor

          In layout files the editor proposes view tags, android: attributes (by class and parent
          layout) and attribute values from the attrs.xml of the installed SDK platform.

          Co-Authored-By: Claude Sonnet 5.5 <noreply@anthropic.com>
          Claude-Session: https://claude.ai/code/session_01F7fjto5o3b3MMLCyXNFeJr"
          git push
