name: Apply command palette (one-off)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/apply_palette.py
      - run: |
          rm tools/apply_palette.py
          git config user.name "asm-bot"
          git config user.email "asm-bot@users.noreply.github.com"
          git add -A
          git commit -m "feat(app): command palette wired into the project screen

          A search button in the top bar opens the palette: files of the project and the commands
          of the IDE (run, format, go to definition, terminal, SDK, toolchain...) in one field.

          Co-Authored-By: Claude Sonnet 5.5 <noreply@anthropic.com>
          Claude-Session: https://claude.ai/code/session_01F7fjto5o3b3MMLCyXNFeJr"
          git push
