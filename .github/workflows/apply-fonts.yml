name: Apply fonts (one-off)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/apply_fonts.py
      - run: |
          set -e
          d=core/ui/src/main/res/font
          mkdir -p $d docs/third-party
          jb=https://raw.githubusercontent.com/JetBrains/JetBrainsMono/v2.304
          curl -fsSL -o $d/jetbrains_mono_regular.ttf $jb/fonts/ttf/JetBrainsMono-Regular.ttf
          curl -fsSL -o $d/jetbrains_mono_medium.ttf $jb/fonts/ttf/JetBrainsMono-Medium.ttf
          curl -fsSL -o $d/jetbrains_mono_bold.ttf $jb/fonts/ttf/JetBrainsMono-Bold.ttf
          curl -fsSL -o docs/third-party/OFL-JetBrainsMono.txt $jb/OFL.txt
          curl -fsSL -o /tmp/inter.zip https://github.com/rsms/inter/releases/download/v4.1/Inter-4.1.zip
          unzip -p /tmp/inter.zip extras/ttf/Inter-Regular.ttf > $d/inter_regular.ttf
          unzip -p /tmp/inter.zip extras/ttf/Inter-Medium.ttf > $d/inter_medium.ttf
          unzip -p /tmp/inter.zip extras/ttf/Inter-SemiBold.ttf > $d/inter_semibold.ttf
          unzip -p /tmp/inter.zip LICENSE.txt > docs/third-party/OFL-Inter.txt
          for f in $d/*.ttf; do test "$(stat -c %s $f)" -gt 100000; done
          sha256sum $d/*.ttf
      - run: |
          rm tools/apply_fonts.py
          git config user.name "asm-bot"
          git config user.email "asm-bot@users.noreply.github.com"
          git add -A
          git commit -m "feat(ui): Inter and JetBrains Mono font files with their licences

          Co-Authored-By: Claude Sonnet 5.5 <noreply@anthropic.com>
          Claude-Session: https://claude.ai/code/session_01F7fjto5o3b3MMLCyXNFeJr"
          git push
