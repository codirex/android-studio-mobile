name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  layering:
    name: Module layering (ADR-0003)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/check_layering.py

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: layering
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Accepting the licenses lets AGP download the compileSdk platform and build tools it needs.
      # The platform id for API 37 is not a plain "android-37", so we do not name it here.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # No Gradle wrapper is committed yet (ADR-0008), so install the version AGP 9.3 requires.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Unit tests
        run: gradle testDebugUnitTest --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: asm-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
