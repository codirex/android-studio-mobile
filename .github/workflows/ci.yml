name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  layering:
    name: Module layering (ADR-0003)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/check_layering.py

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: layering
    steps:
      - uses: actions/checkout@v4

      - name: Native terminal tests (pty_core)
        run: |
          gcc -Wall -Wextra -Werror -std=c99 -o pty_core_test \
            terminal/pty/src/main/cpp/pty_core.c terminal/pty/src/test/cpp/pty_core_test.c \
            -Iterminal/pty/src/main/cpp
          ./pty_core_test

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Accepting the licenses lets AGP download the compileSdk platform and build tools it needs.
      # The platform id for API 37 is not a plain "android-37", so we do not name it here.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # No Gradle wrapper is committed yet (ADR-0008), so install the version AGP 9.3 requires.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      # Debug builds are signed with our own key when its secrets exist, so every build installs
      # over the previous one. Without the secrets (a pull request from a fork) the default debug
      # key is used and the build still works. The key password defaults to the store password.
      - name: Debug signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ASM_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ASM_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ASM_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ASM_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "No signing secrets: the default debug key is used."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/asm.jks"
          {
            echo "ASM_KEYSTORE_FILE=$RUNNER_TEMP/asm.jks"
            echo "ASM_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "ASM_KEY_ALIAS=$KEY_ALIAS"
            [ -z "$KEY_PASSWORD" ] || echo "ASM_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          echo "Debug APK will be signed with the project key."

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      # Android modules run their debug unit tests; JVM (domain) modules run `test`.
      # Add each new JVM module here until a wrapper task replaces this list.
      - name: Unit tests
        run: gradle testDebugUnitTest :domain:common:test :domain:project:test :domain:filetree:test :domain:editor:test :domain:template:test :terminal:emulator:test --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: asm-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
