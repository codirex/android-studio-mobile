name: Apply quick keys (one-off)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/apply_quickkeys.py
      - run: |
          rm tools/apply_quickkeys.py
          git config user.name "asm-bot"
          git config user.email "asm-bot@users.noreply.github.com"
          git add -A
          git commit -m "feat(editor): file path bar and quick keys for symbols

          The path of the shown file sits above the code, and a scrolling row of keys (Tab, braces,
          brackets, quotes, operators) sits under it, as in the design.

          Co-Authored-By: Claude Sonnet 5.5 <noreply@anthropic.com>
          Claude-Session: https://claude.ai/code/session_01F7fjto5o3b3MMLCyXNFeJr"
          git push
