name: icon-once
on: workflow_dispatch
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow numpy
      - name: Render legacy PNGs
        run: python3 tools/icon/make_legacy.py app/src/main/res
      - name: Wire the icon in the manifest
        run: |
          f=app/src/main/AndroidManifest.xml
          if ! grep -q 'android:icon=' "$f"; then
            sed -i 's|^\(\s*\)android:allowBackup="false"|&\n\1android:icon="@mipmap/ic_launcher"\n\1android:roundIcon="@mipmap/ic_launcher"|' "$f"
          fi
          grep -n 'android:icon\|android:roundIcon' "$f"
      - name: Commit
        run: |
          git rm -rq tools/icon
          git config user.name asm-bot
          git config user.email asm-bot@users.noreply.github.com
          git add -A app
          git commit -m "feat(app): launcher icon (legacy PNGs, manifest wiring)" -m "Co-Authored-By: Claude Sonnet 5.5 <noreply@anthropic.com>" -m "Claude-Session: https://claude.ai/code/session_01F7fjto5o3b3MMLCyXNFeJr"
          git push
